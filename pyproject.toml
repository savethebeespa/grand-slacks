[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grand-slacks"
version = "0.1.0"
description = "A scalable emergent sci-fantasy colony roguelike simulation"
requires-python = ">=3.10"

[project.scripts]
grand-slacks = "grand_slacks.cli:main"

[tool.setuptools]
packages = ["grand_slacks"]
